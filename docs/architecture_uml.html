code[class*="language-"],
pre[class*="language-"] {

	-ms-hyphens: none;
	hyphens: none;
}

pre[class*="language-"]::-moz-selection, pre[class*="language-"] ::-moz-selection,
code[class*="language-"]::-moz-selection, code[class*="language-"] ::-moz-selection {
	text-shadow: none;

pre[class*="language-"]::selection, pre[class*="language-"] ::selection,
code[class*="language-"]::selection, code[class*="language-"] ::selection {
	text-shadow: none;

}

@media print {
	code[class*="language-"],

		text-shadow: none;
	}
}

/* Code blocks */
pre[class*="language-"] {
	padding: 1em;
	margin: .5em 0;

}

:not(pre) > code[class*="language-"],
pre[class*="language-"] {
	background: #f5f2f0;
}

:not(pre) > code[class*="language-"] {
	padding: .1em;

	white-space: normal;
}

.token.comment,
.token.prolog,
.token.doctype,
.token.cdata {

.token.important,

.token.entity {
