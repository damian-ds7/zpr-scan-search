[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "scan_search"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "classconf>=0.3.1",
    "click>=8.3.3",
    "textual>=8.2.7",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.maturin]
python-source = "python"

[dependency-groups]
dev = [
    "maturin>=1.13.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "patchelf>=0.17.2.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
